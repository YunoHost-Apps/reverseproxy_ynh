location @__APP__--proxy {
  proxy_pass        __PROXY_PATH__;
  proxy_redirect    off;
  proxy_set_header  Host $host;
  proxy_set_header  X-Real-IP $remote_addr;
  proxy_set_header  X-Forwarded-Proto $scheme;
  proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header  X-Forwarded-Host $server_name;
  proxy_set_header  X-Forwarded-Port $server_port;
  
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  more_clear_input_headers 'Accept-Encoding';

  # Your own directives (e.g. client_max_body_size), kept on upgrade
  include __CUSTOM_CONF_DIR__/*.conf;
}

# Support relative URLs
__REDIRECT_BLOCK__

location __PATH_SLASH__ {
    __ASSETS_ALIAS__
    __TRY_FILES__

    # Also here: e.g. client_max_body_size is checked before reaching the proxy location
    include __CUSTOM_CONF_DIR__/*.conf;
}
