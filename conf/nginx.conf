location @__APP__--proxy {
  proxy_pass        __PROXY_PATH__;
  proxy_redirect    off;
  proxy_set_header  Host $host;
  proxy_set_header  X-Real-IP $remote_addr;
  proxy_set_header  X-Forwarded-Proto $scheme;
  proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header  X-Forwarded-Host $server_name;
  proxy_set_header  X-Forwarded-Port $server_port;
  
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  more_clear_input_headers 'Accept-Encoding';

  # The portal session cookie is only meant for SSOwat
  set_by_lua_block $rp_cookie {
    local cookie = ngx.var.http_cookie
    if not cookie then return "" end
    cookie = (";" .. cookie):gsub(";%s*yunohost%.portal=[^;]*", "")
    return (cookie:gsub("^;%s*", ""))
  }
  proxy_set_header  Cookie $rp_cookie;
}

# Support relative URLs
__REDIRECT_BLOCK__

location __PATH_SLASH__ {
    __ASSETS_ALIAS__
    __TRY_FILES__
}
