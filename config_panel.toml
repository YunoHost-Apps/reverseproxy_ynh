#:schema https://github.com/YunoHost/apps/raw/main/schemas/config_panel.v1.schema.json

version = "1.0"

[main]
name.en = "Configuration"
name.fr = "Configuration"

    [main.proxy]
    name.en = "Reverse proxy"
    name.fr = "Reverse proxy"

        [main.proxy.proxy_path]
        ask.en = "Redirect destination path (unix:/file for socket)"
        ask.fr = "Emplacement de destination (unix:/fichier pour socket)"
        type = "string"
        example = "http://127.0.0.1:8080"

        [main.proxy.sso_auth]
        ask.en = "Authentication passed to the app for users logged in on the YunoHost portal"
        ask.fr = "Authentification transmise à l'application pour les utilisateurs connectés au portail YunoHost"
        help.en = "The identity is the username, email and full name. With a plain HTTP destination on another machine, the password cannot be passed."
        help.fr = "L'identité est le nom d'utilisateur, l'adresse e-mail et le nom complet. Avec une destination en HTTP non chiffré sur une autre machine, le mot de passe ne peut pas être transmis."
        type = "select"
        choices.username_and_password = "Identity and password"
        choices.username = "Identity only, without the password"
        choices.none = "Nothing"

        [main.proxy.assets_path]
        ask.en = "Static assets folder"
        ask.fr = "Dossier pour les fichiers statiques"
        type = "string"
        optional = true
        example = "/opt/foo/www/"
